$kind: http-request
url: "{{baseUrl}}/api/categories"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code es 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"La resposta es un array\", () => {\r

      \  pm.expect(pm.response.json().data).to.be.an(\"array\");\r

      });"
    language: text/javascript
order: 2000
